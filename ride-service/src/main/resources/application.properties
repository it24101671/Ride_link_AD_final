# Server Configuration
server.port=8083

# Application Name
spring.application.name=ride-service

# Database Configuration (Separate Ride DB)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridelink_ride?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mumthas}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Consistent with Account and Driver Services)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Interservice Communication Configuration
ridelink.driver-service.url=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.fare-service.url=${FARE_SERVICE_URL:http://localhost:8084}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
